<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DANI WORID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="frame">
<svg class="ears" viewBox="0 0 200 50" aria-hidden="true"><path class="ear" d="M10 48 L28 4 L72 40 Z"/><path class="earin" d="M26 38 L30 18 L50 34 Z"/><path class="ear" d="M190 48 L172 4 L128 40 Z"/><path class="earin" d="M174 38 L170 18 L150 34 Z"/></svg>
<img id="hero" alt="DANI의 로블록스 캐릭터">
</div>
<div>
<h1>DANI WORID</h1>
<p>고양이 귀를 쫑긋 세운 작은 메이드가 사는 방이에요. 천천히 구경하고 가세요.</p>
</div>
</header>

<section class="card" id="profile">
<div class="tab"><svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21C2 14 3 5 8 5c2 0 4 2 4 2s2-2 4-2c5 0 6 9-4 16z" fill="currentColor"/></svg>프로필</div>
<div class="inner"><div class="me">
<div class="avatar"><img id="face" alt="DANI 얼굴"></div>
<dl>
<dt>이름</dt><dd>DANI</dd>
<dt>소개</dt><dd>검은 머리에 고양이 귀, 하얀 앞치마가 트레이드마크인 로블록스 캐릭터예요.</dd>
<dt>캐릭터 특징</dt><dd><span class="chip">검은 장발</span><span class="chip">고양이 귀</span><span class="chip">은빛 눈</span><span class="chip">하트 앞치마</span><span class="chip">검은 후드</span></dd>
<dt>오늘 기분</dt><dd><div class="hearts" id="hearts" role="img" aria-label="5칸 중 4칸"></div></dd>
</dl></div></div>
</section>

<section class="card" id="gallery">
<div class="tab"><svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21C2 14 3 5 8 5c2 0 4 2 4 2s2-2 4-2c5 0 6 9-4 16z" fill="currentColor"/></svg>갤러리</div>
<div class="inner"><div class="grid" id="grid"></div></div>
</section>

<section class="card" id="playlist">
<div class="tab"><svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21C2 14 3 5 8 5c2 0 4 2 4 2s2-2 4-2c5 0 6 9-4 16z" fill="currentColor"/></svg>플레이리스트</div>
<div class="inner">
<div class="deck" id="player">
<svg class="dear l" viewBox="0 0 50 40" aria-hidden="true"><path class="ear" d="M3 38 L12 3 L47 30 Z"/><path class="earin" d="M14 30 L16 15 L32 27 Z"/></svg><svg class="dear r" viewBox="0 0 50 40" aria-hidden="true"><path class="ear" d="M3 38 L12 3 L47 30 Z"/><path class="earin" d="M14 30 L16 15 L32 27 Z"/></svg>
<div class="screen"><div class="idle" id="idle"><svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21C2 14 3 5 8 5c2 0 4 2 4 2s2-2 4-2c5 0 6 9-4 16z" fill="#E8999C"/></svg><span id="im"></span></div><div class="yt" id="yt" hidden></div></div>
<div><h3 id="tt"></h3><p id="ta"></p>
<div class="prog" aria-hidden="true"><div id="bar"></div></div>
<div class="ctl"><button class="btn round" id="prev" aria-label="이전 곡">◀</button><button class="btn round" id="play" aria-label="재생">▶</button><button class="btn round" id="next" aria-label="다음 곡">▶▶</button></div></div>
</div>
<ol id="list"></ol>
</div>
</section>
<footer>© DANI WORID</footer>
</div>

<dialog id="dlg"><img id="dimg" alt=""><h3 id="dname"></h3><p id="dcap"></p><button class="btn" id="dclose">닫기</button></dialog>

<script src="script.js"></script>
</body>
</html>
