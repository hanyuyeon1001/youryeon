        body {

    <!-- Firebase & Core Application Integrated Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'dani-pocket-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyDummyKeyForLocalDevRunOnly",
                authDomain: "demo-project.firebaseapp.com",
                projectId: "demo-project",
                storageBucket: "demo-project.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:abcdef"
            };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const guestbookColRef = collection(db, 'artifacts', appId, 'public', 'data', 'guestbook');
        let currentUser = null;

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth error:", err);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                subscribeGuestbook();
            }
        });

        function subscribeGuestbook() {
            onSnapshot(guestbookColRef, (snapshot) => {
                const list = document.getElementById('guestbook-list');
                if (!list) return;

                const entries = [];
                snapshot.forEach((doc) => {
                    entries.push({ id: doc.id, ...doc.data() });
                });

                entries.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                if (entries.length === 0) {
                    list.innerHTML = `
                        <div class="bg-pink-50/50 rounded-xl p-3 border border-pink-100 text-center py-4">
                            <p class="text-xs text-pink-500 font-pixel">첫 번째 메시지를 남겨보세요! ♡</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = entries.map(item => `
                    <div class="bg-pink-50/80 p-2.5 rounded-xl border border-pink-100 flex justify-between items-start text-xs group relative hover:border-pink-300 transition-all">
                        <div class="space-y-1 pr-4 w-full">
                            <div class="flex items-center justify-between border-b border-pink-100/60 pb-1">
                                <span class="font-bold text-pink-600 font-pixel">🎀 ${escapeHtml(item.name || '익명')}</span>
                                <span class="text-[10px] text-pink-400 font-pixel">${item.date || ''}</span>
                            </div>
                            <p class="text-gray-600 font-hand text-sm leading-relaxed">${escapeHtml(item.msg || '')}</p>
                        </div>
                        <button onclick="window.deleteGuestbookEntry('${item.id}')" 
                                title="방명록 삭제" 
                                class="text-pink-300 hover:text-pink-600 transition-colors p-0.5 rounded text-xs leading-none font-bold">
                            ✕
                        </button>
                    </div>
                `).join('');
            }, (error) => {
                console.error("Guestbook snapshot error:", error);
            });
        }

        // 방명록 삭제 (비밀번호/관리자 암호 확인)
        window.deleteGuestbookEntry = async function(docId) {
            if (!docId) return;

            const inputPass = prompt('방명록 작성 시 입력한 비밀번호(또는 관리자 암호)를 입력해주세요:');
            
            if (inputPass === null || inputPass.trim() === '') {
                showNotification('삭제가 취소되었습니다.');
                return; 
            }

            const ADMIN_PASSWORD = '1234';
            const savedPassword = sessionStorage.getItem('guest_pass_' + docId);

            if (inputPass === ADMIN_PASSWORD || (savedPassword && inputPass === savedPassword)) {
                try {
                    const targetRef = doc(db, 'artifacts', appId, 'public', 'data', 'guestbook', docId);
                    await deleteDoc(targetRef);
                    showNotification('방명록이 정상 삭제되었습니다 ♡');
                } catch (err) {
                    console.error("Error deleting entry:", err);
                    showNotification('삭제 중 오류가 발생했습니다.');
                }
            } else {
                showNotification('비밀번호가 일치하지 않습니다! ❌');
            }
        };

        // 방명록 등록
        window.addGuestbookEntry = async function() {
            const nameInput = document.getElementById('guest-name');
            const passInput = document.getElementById('guest-pass');
            const msgInput = document.getElementById('guest-msg');

            const name = nameInput.value.trim();
            const pass = passInput ? passInput.value.trim() : '';
            const msg = msgInput.value.trim();

            if (!name || !msg) {
                showNotification('이름과 내용을 입력해주세요 ♡');
                return;
            }

            if (!pass) {
                showNotification('비밀번호를 입력해주세요 (삭제용) ♡');
                return;
            }

            if (!currentUser) {
                showNotification('서버 연결 중입니다. 잠시 후 다시 시도해주세요 ♡');
                return;
            }

            const today = new Date();
            const dateStr = `${today.getFullYear()}.${String(today.getMonth() + 1).padStart(2, '0')}.${String(today.getDate()).padStart(2, '0')}`;

            try {
                const docRef = await addDoc(guestbookColRef, {
                    name: name,
                    msg: msg,
                    date: dateStr,
                    createdAt: Date.now(),
                    userId: currentUser.uid
                });

                sessionStorage.setItem('guest_pass_' + docRef.id, pass);

                nameInput.value = '';
                if (passInput) passInput.value = '';
                msgInput.value = '';
                showNotification('방명록이 등록되었습니다 ♡');
            } catch (err) {
                console.error("Error adding entry:", err);
                showNotification('방명록 저장에 실패했습니다.');
            }
        };

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function showNotification(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-pink-500 text-white px-4 py-2 rounded-xl text-xs shadow-lg z-50 transition-all transform translate-y-2 opacity-0 font-bold font-pixel';
            toast.innerText = msg;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        initAuth();
    </script>

    <script>
        // YouTube Player Logic
        let ytPlayer = null;
        let isPlaying = false;
        let progressInterval = null;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '1',
                width: '1',
                videoId: 'f-KLYLZ17Wo',
                playerVars: { 'playsinline': 1, 'controls': 0 },
                events: {
                    'onReady': () => console.log("YouTube Ready ♡"),
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            const playBtn = document.getElementById('play-btn');
            const musicEq = document.getElementById('music-eq');
            
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                if (playBtn) playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                if (musicEq) musicEq.classList.remove('opacity-0');
                startProgressBar();
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED || event.data === YT.PlayerState.CUED) {
                isPlaying = false;
                if (playBtn) playBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
                if (musicEq) musicEq.classList.add('opacity-0');
                stopProgressBar();
            }
        }

        window.togglePlay = function() {
            if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') {
                showToast('음악 플레이어를 준비 중입니다 ♡');
                return;
            }

            try {
                if (isPlaying) {
                    ytPlayer.pauseVideo();
                } else {
                    ytPlayer.playVideo();
                    showToast('노래를 재생합니다 ♬');
                }
            } catch(e) {
                console.error(e);
            }
        };

        window.prevSong = function() {
            if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
                ytPlayer.seekTo(0);
            }
            showToast('처음으로 돌아갑니다 ♡');
        };

        window.nextSong = function() {
            showToast('다음 곡 준비 중입니다 ♡');
        };

        function startProgressBar() {
            stopProgressBar();
            progressInterval = setInterval(() => {
                if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function' && typeof ytPlayer.getDuration === 'function') {
                    const currentTime = ytPlayer.getCurrentTime() || 0;
                    const duration = ytPlayer.getDuration() || 1;
                    const percent = (currentTime / duration) * 100;

                    const seekBar = document.getElementById('seek-bar');
                    const currentTimeEl = document.getElementById('current-time');
                    const durationTimeEl = document.getElementById('duration-time');

                    if (seekBar) seekBar.value = percent;
                    if (currentTimeEl) currentTimeEl.innerText = formatTime(currentTime);
                    if (durationTimeEl) durationTimeEl.innerText = formatTime(duration);
                }
            }, 300);
        }

        function stopProgressBar() {
            if (progressInterval) clearInterval(progressInterval);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Calendar Controller
        const todayObj = new Date();
        let currentYear = todayObj.getFullYear();
        let currentMonth = todayObj.getMonth() + 1;

        function renderCalendar() {
            const titleEl = document.getElementById('calendar-title');
            const daysEl = document.getElementById('calendar-days');

            if (!titleEl || !daysEl) return;

            titleEl.innerText = `${currentYear}.${String(currentMonth).padStart(2, '0')}`;

            const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth, 0).getDate();

            let daysHtml = '';
            for (let i = 0; i < firstDay; i++) {
                daysHtml += '<div></div>';
            }

            const now = new Date();
            const isCurrentMonth = now.getFullYear() === currentYear && (now.getMonth() + 1) === currentMonth;

            for (let d = 1; d <= totalDays; d++) {
                const isToday = isCurrentMonth && d === now.getDate();
                daysHtml += `<div class="calendar-day ${isToday ? 'today' : ''}">${d}</div>`;
            }

            daysEl.innerHTML = daysHtml;
        }

        window.changeMonth = function(delta) {
            currentMonth += delta;
            if (currentMonth > 12) {
                currentMonth = 1;
                currentYear++;
            } else if (currentMonth < 1) {
                currentMonth = 12;
                currentYear--;
            }
            renderCalendar();
        };

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-pink-500 text-white px-4 py-2 rounded-xl text-xs shadow-lg z-50 transition-all transform translate-y-2 opacity-0 font-bold font-pixel';
            toast.innerText = msg;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        window.onload = function() {
            renderCalendar();
            setInterval(() => {
                renderCalendar();
            }, 60000);
        };
    </script>
</body>
</html>
